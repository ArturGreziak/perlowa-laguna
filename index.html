$('primary').onclick=()=>state==='pause'?pause():start();$('pause').onclick=pause;$('reset').onclick=()=>{if(state==='intro'||state==='over'){start();return}if(state==='reset'){start();return}state='reset';keys.left=keys.right=false;charging=false;charge=0;show('Nowa rozgrywka?','Zaczniesz od zera z trzema kulami. Zapisany rekord pozostanie.','TAK, NOWA GRA','RESTART');$('secondary').hidden=false};$('secondary').onclick=()=>{state='play';$('overlay').hidden=true};$('sound').onclick=()=>{sound=!sound;$('sound').style.color=sound?C.accent:'#fff';$('sound').setAttribute('aria-label',sound?'Wyłącz dźwięk':'Włącz dźwięk');tone()};
for(let name of ['left','right','launch']){let e=$(name);e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);if(name==='launch')launchDown();else if(state==='play')keys[name]=true});e.addEventListener('pointerup',()=>{if(name==='launch')launchUp();else keys[name]=false});e.addEventListener('pointercancel',()=>{if(name==='launch'){charging=false;charge=0}else keys[name]=false});e.addEventListener('lostpointercapture',()=>{if(name==='launch')launchUp();else keys[name]=false})}
window.addEventListener('keydown',e=>{let k=e.code;if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyP'].includes(k))e.preventDefault();if(k==='KeyP'&&!e.repeat)pause();if(state!=='play')return;if(k==='ArrowLeft'||k==='KeyA')keys.left=true;if(k==='ArrowRight'||k==='KeyD')keys.right=true;if(k==='Space'&&!e.repeat)launchDown()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space'){e.preventDefault();launchUp()}});window.addEventListener('blur',()=>{keys.left=keys.right=false;if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
